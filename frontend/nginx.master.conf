worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Real client IP ---------------------------------------------------
    # Traffic arrives via nginx-proxy-manager on the web-proxy network, so
    # $remote_addr is the proxy, not the visitor. Recover the visitor address
    # from X-Forwarded-For, trusting only the proxy network. real_ip_recursive
    # walks the chain from the right and skips trusted hops, so a client that
    # sends its own X-Forwarded-For cannot inject a false address.
    #
    # This makes $remote_addr the real visitor everywhere below: access logs,
    # the rate-limit keys, and the headers forwarded to the backend.
    set_real_ip_from 172.19.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # --- Abusive client blocklist -----------------------------------------
    # Matched against User-Agent. Blocking by UA is trivially evaded, so this is
    # only a cheap first filter — the rate limits below are the real defence.
    map $http_user_agent $blocked_user_agent {
        default                       0;
        "~*bedriftsgrafen-csv-export" 1;
    }

    # --- Rate limiting ----------------------------------------------------
    # Edge limits, independent of the application. The backend has its own
    # per-IP limits, but those live in application state and were bypassable;
    # these hold even if the app-side limiter misbehaves.
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;

    # /roles is the expensive endpoint: a request that misses the 7-day cache
    # costs one upstream Brønnøysund call plus a delete+insert of the company's
    # roles. The UI fetches it once per company page view, so a low sustained
    # rate with room for a burst does not affect normal browsing.
    #
    # An empty key makes nginx skip the zone for that request, which lets one
    # location carry both a general and an endpoint-specific limit. Keyed on
    # $request_uri (original and immutable) rather than $uri, because location
    # rewrites run before limit_req is evaluated.
    map $request_uri $roles_limit_key {
        default                                    "";
        "~^/api/v1/companies/[0-9]{9}/roles(\?|$)" $binary_remote_addr;
    }
    limit_req_zone $roles_limit_key zone=api_roles:10m rate=2r/s;

    # Other public routes can fan one request out into several Brreg calls.
    # A subunit refresh may paginate through as many as 50 upstream pages, and
    # /fetch may chain company, subunit, role, and accounting lookups. Keep a
    # separate low sustained edge rate for these routes. Method matching avoids
    # accidentally applying the /fetch rule to a harmless future GET route.
    map "$request_method:$request_uri" $brreg_refresh_limit_key {
        default                                              "";
        "~^GET:/api/v1/companies/[0-9]{9}/subunits(\?|$)"   $binary_remote_addr;
        "~^POST:/api/v1/companies/[0-9]{9}/fetch(\?|$)"     $binary_remote_addr;
    }
    limit_req_zone $brreg_refresh_limit_key zone=api_brreg_refresh:10m rate=1r/s;

    # Return 429 rather than nginx's default 503, so clients and dashboards can
    # tell throttling apart from an outage.
    limit_req_status 429;
    limit_req_log_level warn;

    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    types_hash_max_size 4096;

    # Include our site configuration
    include /etc/nginx/conf.d/*.conf;
}
