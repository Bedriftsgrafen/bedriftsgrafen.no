<!doctype html>
<html lang="no">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Bedriftsgrafen.no</title>

  <script>
    (function () {
      try {
        var stored = localStorage.getItem('bedriftsgrafen-theme');
        var theme = 'system';

        if (stored) {
          var parsed = JSON.parse(stored);
          theme = (parsed && parsed.state && parsed.state.theme) || parsed.theme || 'system';
        }

        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = theme === 'dark' || (theme === 'system' && prefersDark);
        document.documentElement.classList.toggle('dark', isDark);
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
      } catch (error) {
        document.documentElement.style.colorScheme = 'light';
      }
    }());
  </script>

  <!-- Preload the headline font used by the mobile LCP element -->
  <link rel="preload" href="/fonts/Inter-Bold.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Favicon and icons -->

  <!-- Google Analytics - delayed so mobile LCP is driven by app content, not third-party JS -->
  <script>
    (function () {
      var analyticsLoaded = false;
      var analyticsDelayMs = 5000;

      function loadAnalytics() {
        if (analyticsLoaded) return;
        analyticsLoaded = true;

      var script = document.createElement('script');
      script.src = 'https://www.googletagmanager.com/gtag/js?id=G-8GYNJE4Z3Q';
      script.async = true;
      document.head.appendChild(script);

      script.onload = function () {
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        // Set default consent to be privacy-friendly
        gtag('consent', 'default', {
          'ad_storage': 'denied',
          'ad_user_data': 'denied',
          'ad_personalization': 'denied',
          'analytics_storage': 'granted',
          'wait_for_update': 500
        });

        // Initialize GA4 with restricted data features
        gtag('config', 'G-8GYNJE4Z3Q', {
          'anonymize_ip': true,
          'allow_google_signals': false,
          'allow_ad_personalization_signals': false,
          'debug_mode': false
        });
      };

      }

      function scheduleAnalytics() {
        window.setTimeout(function () {
          if ('requestIdleCallback' in window) {
            window.requestIdleCallback(loadAnalytics, { timeout: 2000 });
            return;
          }

          loadAnalytics();
        }, analyticsDelayMs);
      }

      if (document.readyState === 'complete') {
        scheduleAnalytics();
      } else {
        window.addEventListener('load', scheduleAnalytics, { once: true });
      }

      window.addEventListener('pointerdown', loadAnalytics, { once: true, passive: true });
      window.addEventListener('keydown', loadAnalytics, { once: true });
    }());
  </script>
