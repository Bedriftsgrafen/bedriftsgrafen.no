server {
    listen 8080;
    server_name localhost;

    # Disable server tokens for security
    server_tokens off;

    # Security Headers
    # NOTE: These server-level headers are NOT inherited by location blocks
    # that define their own add_header. Each such location must include
    # security-headers.conf. See: https://nginx.org/en/docs/http/ngx_http_headers_module.html
    include /etc/nginx/security-headers.conf;

    # DNS for upstream resolution. 127.0.0.11 is Docker's embedded resolver.
    # Every proxy_pass below goes through a variable so that the backend address
    # is resolved per request and honours this TTL. With a literal hostname nginx
    # resolves once at config load, so redeploying the backend (which gives it a
    # new container IP) leaves this proxy talking to a dead address until it is
    # restarted — that caused an /api/ outage on 2026-08-04.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Drop known abusive clients before any work is done.
    #
    # 403, not 444: this server sits behind nginx-proxy-manager, which turns a
    # closed connection into a 502. That would manufacture server-error noise
    # for what is a deliberate client rejection, polluting the 5xx metrics and
    # the API-5xx alert. 403 passes through the proxy unchanged.
    if ($blocked_user_agent) {
        return 403;
    }

    # Enable Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
        include /etc/nginx/security-headers.conf;
    }

    # Deny access to hidden files (e.g., .git, .env)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Block common vulnerability scanners and sensitive file probes
    # Returns 444 (connection closed without response) to waste scanner resources
    location ~* \.(php[0-9]?|asp|aspx|jsp|cgi|pl|py|rb|sh|bak|orig|save|swp|sql|log|ini|conf)$ {
        return 444;
    }
    location ~* /(wp-admin|wp-login|wp-content|wp-includes|wordpress|xmlrpc|administrator|admin\.php) {
        return 444;
    }
    location ~* /(\.aws|\.docker|\.kube|\.ssh|\.gnupg|secrets|private|backup|dump) {
        return 444;
    }

    # SEO: 301 redirect from legacy /bedrift/ to /virksomhet/
    # Critical for search engine PageRank transfer and deduplication
    location ~ "^/bedrift/([0-9]{9})$" {
        return 301 /virksomhet/$1$is_args$args;
    }

    # SEO: 301 redirect from legacy /personer to /person?tab=sok
    location = /personer {
        return 301 /person?tab=sok$is_args$args;
    }

    # Proxy sitemap.xml to the backend sitemap index
    location = /sitemap.xml {
        set $sitemap_backend "http://bedriftsgrafen-backend:8000";
        proxy_pass $sitemap_backend/sitemap_index.xml;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /sitemap_index.xml {
        set $sitemap_backend "http://bedriftsgrafen-backend:8000";
        proxy_pass $sitemap_backend/sitemap_index.xml;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Sitemap pages - longer timeout for cache warmup edge cases
    location ~ ^/api/sitemaps/(.*)$ {
        limit_req zone=api_general burst=40 nodelay;

        set $sitemap_backend "http://bedriftsgrafen-backend:8000";
        proxy_pass $sitemap_backend/sitemaps/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # GDPR: 301 redirect full-birthdate person URLs to year-only
    # Bots crawling /person/Name/1996-03-12 get permanently redirected to /person/Name/1996
    # [^/]+ restricts to single path segment (prevents traversal/CRLF injection)
    location ~ "^/person/([^/]+)/(\d{4})-\d{2}-\d{2}$" {
        return 301 /person/$1/$2;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        
        # Don't cache HTML files (they contain references to hashed assets)
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }

    # Cache static assets (JS, CSS, Images) aggressively
    # gzip_static serves pre-compressed .gz files from the Docker build stage
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        gzip_static on;
        access_log off;
    }

    # Proxy API requests to the backend service
    location /api/ {
        # Edge rate limits. api_roles only engages for the roles endpoint (its
        # key is empty elsewhere); see the zone definitions in nginx.master.conf.
        limit_req zone=api_general burst=40 nodelay;
        limit_req zone=api_roles burst=10 nodelay;
        limit_req zone=api_brreg_refresh burst=5 nodelay;

        # Resolved per request via the variable — see the resolver note above.
        # The rewrite reproduces what the old trailing-slash proxy_pass did:
        # strip the /api prefix before forwarding. Query args are carried over
        # automatically because proxy_pass has no URI component of its own.
        set $api_backend "http://bedriftsgrafen-backend:8000";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite rather than forward the incoming chain: $remote_addr is the
        # address real_ip derived from the trusted proxy, so a client cannot
        # supply its own X-Forwarded-For to evade the backend's per-IP limits.
        proxy_set_header X-Forwarded-For $remote_addr;

        # Security headers for proxied API responses
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
}
