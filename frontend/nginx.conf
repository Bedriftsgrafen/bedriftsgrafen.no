server {
    listen 8080;
    server_name localhost;

    # Disable server tokens for security
    server_tokens off;

    # Security Headers
    # NOTE: These server-level headers are NOT inherited by location blocks
    # that define their own add_header. Each such location must include
    # security-headers.conf. See: https://nginx.org/en/docs/http/ngx_http_headers_module.html
    include /etc/nginx/security-headers.conf;

    # Enable Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
        include /etc/nginx/security-headers.conf;
    }

    # Deny access to hidden files (e.g., .git, .env)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Block common vulnerability scanners and sensitive file probes
    # Returns 444 (connection closed without response) to waste scanner resources
    location ~* \.(php[0-9]?|asp|aspx|jsp|cgi|pl|py|rb|sh|bak|orig|save|swp|sql|log|ini|conf)$ {
        return 444;
    }
    location ~* /(wp-admin|wp-login|wp-content|wp-includes|wordpress|xmlrpc|administrator|admin\.php) {
        return 444;
    }
    location ~* /(\.aws|\.docker|\.kube|\.ssh|\.gnupg|secrets|private|backup|dump) {
        return 444;
    }

    # SEO: 301 redirect from legacy /bedrift/ to /virksomhet/
    # Critical for search engine PageRank transfer and deduplication
    location ~ "^/bedrift/([0-9]{9})$" {
        return 301 /virksomhet/$1$is_args$args;
    }

    # SEO: 301 redirect from legacy /personer to /person?tab=sok
    location = /personer {
        return 301 /person?tab=sok$is_args$args;
    }

    # Proxy sitemap.xml to the backend sitemap index
    location = /sitemap.xml {
        proxy_pass http://bedriftsgrafen-backend:8000/sitemap_index.xml;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /sitemap_index.xml {
        proxy_pass http://bedriftsgrafen-backend:8000/sitemap_index.xml;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Sitemap pages - longer timeout for cache warmup edge cases
    location ~ ^/api/sitemaps/(.*)$ {
        proxy_pass http://bedriftsgrafen-backend:8000/sitemaps/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # GDPR: 301 redirect full-birthdate person URLs to year-only
    # Bots crawling /person/Name/1996-03-12 get permanently redirected to /person/Name/1996
    # [^/]+ restricts to single path segment (prevents traversal/CRLF injection)
    location ~ "^/person/([^/]+)/(\d{4})-\d{2}-\d{2}$" {
        return 301 /person/$1/$2;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        
        # Don't cache HTML files (they contain references to hashed assets)
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }

    # Cache static assets (JS, CSS, Images) aggressively
    # gzip_static serves pre-compressed .gz files from the Docker build stage
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        gzip_static on;
        access_log off;
    }

    # Proxy API requests to the backend service
    location /api/ {
        proxy_pass http://bedriftsgrafen-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Security headers for proxied API responses
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
}
