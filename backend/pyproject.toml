[project]
name = "bedriftsgrafen-backend"
version = "1.0.0"
description = "Backend for Bedriftsgrafen.no"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.40.0",
    "pydantic>=2.12.5",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.46",
    "asyncpg==0.31.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.3",
    "redis[hiredis]>=7.1.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "ijson>=3.4.0",
    "httpx>=0.28.1",
    "aiolimiter>=1.2.1",
    "APScheduler>=3.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "polyfactory>=3.2.0",
    "faker>=38.2.0",
    "freezegun>=1.5.5",
    "mypy>=1.19.1",
    "ruff>=0.14.14",
    "pip-tools>=7.5.2",
]

[tool.ruff]
# Same as line-length in Black
line-length = 120
target-version = "py314"

# Exclude test files and migrations from some checks
exclude = [
    "alembic/versions/*.py",
    "__pycache__",
    ".git",
    ".venv",
    "venv",
]

[tool.ruff.lint]
# Enable common rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI uses this)
    "B904",   # raise without from (sometimes intentional)
    "ARG001", # unused function argument (common in repos/services)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "S101"]  # Allow unused args and asserts in tests
"alembic/*" = ["E501", "I001"]  # Allow long lines and unordered imports in migrations

[tool.mypy]
python_version = "3.14"
warn_return_any = false  # SQLAlchemy uses Any extensively
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true
plugins = ["sqlalchemy.ext.mypy.plugin", "pydantic.mypy"]
exclude = [
    "alembic/",
    "tests/",
    "scripts/",
    "ops_scripts/",
]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=. --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:This AsyncLimiter instance:RuntimeWarning",
    "ignore:coroutine.*was never awaited:RuntimeWarning",
]
