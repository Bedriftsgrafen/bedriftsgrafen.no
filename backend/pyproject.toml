[project]
name = "bedriftsgrafen-backend"
version = "1.0.0"
description = "Backend for Bedriftsgrafen.no"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "starlette>=1.6.0,<2.0.0",
    "uvicorn[standard]>=0.44.0",
    "pydantic>=2.13.4",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg==0.31.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "mako>=1.4.1",
    "redis[hiredis]>=7.1.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "ijson>=3.5.1",
    "httpx>=0.28.1",
    "APScheduler>=3.11.3",
    "prometheus-fastapi-instrumentator>=8.1.0,<9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "polyfactory>=3.2.0",
    "faker>=40.36.0",
    "freezegun>=1.5.5",
    "mypy>=1.20.0",
    "ruff>=0.16.3",
    "pip-tools>=7.6.1",
    "httpx2>=2.10.0",
]

[tool.ruff]
# Same as line-length in Black
line-length = 120
target-version = "py314"

# Exclude test files and migrations from some checks
exclude = [
    "alembic/versions/*.py",
    "__pycache__",
    ".git",
    ".venv",
    "venv",
]

[tool.ruff.lint]
# Enable common rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print
    "RUF",   # ruff-specific rules
    "FURB",  # refurb - catches deprecated stdlib and third-party API usage
    "LOG",   # flake8-logging (prevents root-logger use, LOG015)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI uses this)
    "B904",   # raise without from (sometimes intentional)
    "ARG001", # unused function argument (common in repos/services)
    "ARG002", # unused method argument (common in repos/services with shared interfaces)
    "RUF012", # mutable class default (SQLAlchemy __table_args__ + service caches)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "ARG005", "B007", "B023", "RUF059", "S101", "S108", "S110", "SIM105", "SIM117"]
"scripts/*" = ["T20", "E402", "W291", "W293"]  # Allow print(), late imports, trailing whitespace in CLI scripts
"alembic/*" = ["E501", "I001"]  # Allow long lines and unordered imports in migrations

[tool.mypy]
python_version = "3.14"
warn_return_any = false  # SQLAlchemy uses Any extensively
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["sqlalchemy.ext.mypy.plugin", "pydantic.mypy"]
exclude = [
    "alembic/",
    "tests/",
    "scripts/",
    "ops_scripts/",
]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]


[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/scripts/*",
    "*/ops_scripts/*",
    "*/alembic/*",
    "*/.venv/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=. --cov-report=term-missing --cov-config=pyproject.toml"
filterwarnings = [
    "ignore::DeprecationWarning:slowapi",  # asyncio.iscoroutinefunction deprecated in 3.14, removed in 3.16; upstream slowapi issue
    "ignore:coroutine.*was never awaited:RuntimeWarning",
]
