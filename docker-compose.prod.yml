name: bedriftsgrafen

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: bedriftsgrafen-backend
    restart: always
    init: true
    env_file:
      - .env
    environment:
      - START_SCHEDULER=false
      - REDIS_HOST=bedriftsgrafen-redis
      - WARM_SITEMAP_CACHE=true
      - DB_POOL_SIZE=8
      - DB_MAX_OVERFLOW=5
    volumes:
      - ./scripts:/app/ops_scripts:ro
      - ./backend/logs:/app/logs
    logging: *default-logging

    ports:
      - "127.0.0.1:8000:8000"
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8000"
      - "prometheus.path=/metrics"
    networks:
      - internal-net
      - web-proxy
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1280M
        reservations:
          memory: 256M
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health/ready" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: bedriftsgrafen-worker
    restart: always
    init: true
    env_file:
      - .env
    environment:
      - START_SCHEDULER=true
      - DB_POOL_SIZE=2
      - DB_STATEMENT_TIMEOUT=60000
      - REDIS_HOST=bedriftsgrafen-redis
    command: [ "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1" ]
    volumes:
      - ./scripts:/app/ops_scripts:ro
      - ./backend/logs:/app/logs
    logging: *default-logging
    networks:
      - internal-net
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8000"
      - "prometheus.path=/metrics"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1280M
        reservations:
          memory: 128M
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health/ready" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: bedriftsgrafen-frontend
    restart: always
    init: true
    ports:
      - "127.0.0.1:3000:8080"
    networks:
      - web-proxy
      - internal-net
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 32M

  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: bedriftsgrafen-db
    restart: always
    init: true # Tini init for proper signal handling and zombie reaping
    shm_size: '1gb'
    command: [ "postgres", "-c", "shared_buffers=512MB", "-c", "work_mem=16MB", "-c", "maintenance_work_mem=128MB", "-c", "effective_cache_size=4GB", "-c", "max_wal_size=2GB", "-c", "min_wal_size=256MB", "-c", "jit=off" ]
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ${POSTGRES_DATA_PATH:-./postgres_data}:/var/lib/postgresql
    logging: *default-logging
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - internal-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1792M
        reservations:
          memory: 256M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:8.4-alpine
    container_name: bedriftsgrafen-redis
    restart: always
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru" ]
    volumes:
      - redis_data:/data
    logging: *default-logging
    networks:
      - internal-net
    #    ports:
    #      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  web-proxy:
    external: true
  internal-net:
    driver: bridge

volumes:
  redis_data:
