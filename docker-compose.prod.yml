name: bedriftsgrafen

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: bedriftsgrafen-backend
    restart: always
    init: true
    env_file:
      - .env
    environment:
      - START_SCHEDULER=false
      - REDIS_HOST=bedriftsgrafen-redis
    volumes:
      - ./scripts:/app/ops_scripts:ro
      - ./backend/logs:/app/logs

    ports:
      - "8000:8000"
    networks:
      - internal-net
      - web-proxy
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: bedriftsgrafen-worker
    restart: always
    init: true
    env_file:
      - .env
    environment:
      - START_SCHEDULER=true
      - DB_POOL_SIZE=2
      - DB_STATEMENT_TIMEOUT=60000
      - REDIS_HOST=bedriftsgrafen-redis
    command: [ "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1" ]
    volumes:
      - ./scripts:/app/ops_scripts:ro
      - ./backend/logs:/app/logs
    networks:
      - internal-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: bedriftsgrafen-frontend
    restart: always
    init: true
    ports:
      - "3000:8080"
    networks:
      - web-proxy
      - internal-net
    depends_on:
      backend:
        condition: service_healthy

  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: bedriftsgrafen-db
    restart: always
    init: true # Tini init for proper signal handling and zombie reaping
    shm_size: '1gb'
    command: [ "postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=16MB", "-c", "maintenance_work_mem=128MB", "-c", "effective_cache_size=4GB", "-c", "max_wal_size=2GB", "-c", "min_wal_size=256MB" ]
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - ${POSTGRES_DATA_PATH:-./postgres_data}:/var/lib/postgresql/data
    #    ports:
    #      - "5432:5432"
    networks:
      - internal-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:8.4-alpine
    container_name: bedriftsgrafen-redis
    restart: always
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru" ]
    volumes:
      - redis_data:/data
    networks:
      - internal-net
    #    ports:
    #      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  web-proxy:
    external: true
  internal-net:
    driver: bridge

volumes:
  redis_data:
