                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: PostgreSQL has a transaction older than 10 minutes.
          description: Long transactions can block vacuum and keep dead tuples alive.
          runbook_url: https://github.com/Bedriftsgrafen/bedriftsgrafen.no/blob/main/observability/runbooks/alerts.md#postgresql-long-transaction
        labels:
          severity: warning
          service: postgres
        isPaused: false

