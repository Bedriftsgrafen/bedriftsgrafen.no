apiVersion: 1

groups:
  - orgId: 1
    name: Brreg Egress Protection
    folder: Bedriftsgrafen
    interval: 30s
    rules:
      - uid: bedriftsgrafen_brreg_egress_at_configured_cap
        title: Brreg egress at configured cap
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: ((sum(rate(bedriftsgrafen_brreg_http_attempts_total[5m])) / clamp_min(max(bedriftsgrafen_brreg_egress_config{setting="rate_per_second"}), 0.001)) * (max(bedriftsgrafen_brreg_egress_config{setting="enabled"}) == bool 1) * (max(bedriftsgrafen_brreg_egress_config{setting="rate_per_second"}) > bool 0)) >= bool 1
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: Brreg egress is at the configured global cap.
          description: Actual Brreg HTTP attempt rate is greater than or equal to BRREG_EGRESS_RATE_PER_SECOND.
          runbook_url: https://github.com/Bedriftsgrafen/bedriftsgrafen.no/blob/main/observability/runbooks/alerts.md#brreg-egress-protection
        labels:
          severity: warning
          service: brreg
        isPaused: false

