apiVersion: 1

policies:
  - orgId: 1
    receiver: bedriftsgrafen-discord
    group_by:
      - alertname
      - service
      - severity
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: bedriftsgrafen-discord
        object_matchers:
          - [severity, "=", critical]
        group_wait: 10s
        group_interval: 2m
        repeat_interval: 1h
      - receiver: bedriftsgrafen-discord
        object_matchers:
          - [severity, "=", warning]
        group_wait: 1m
        group_interval: 10m
        repeat_interval: 6h