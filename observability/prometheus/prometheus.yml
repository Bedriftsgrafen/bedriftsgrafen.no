global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus

  - job_name: bedriftsgrafen-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/prometheus_metrics_token
    static_configs:
      - targets: ["bedriftsgrafen-backend:8000"]
        labels:
          service: backend
          environment: production
      - targets: ["bedriftsgrafen-worker:8000"]
        labels:
          service: worker
          environment: production

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["monitoring-grafana:3000"]
        labels:
          service: grafana

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: ["monitoring-loki:3100"]
        labels:
          service: loki

  - job_name: alloy
    metrics_path: /metrics
    static_configs:
      - targets: ["monitoring-alloy:12345"]
        labels:
          service: alloy

  - job_name: cadvisor
    metrics_path: /metrics
    scrape_interval: 60s
    scrape_timeout: 20s
    static_configs:
      - targets: ["monitoring-cadvisor:8080"]
        labels:
          service: cadvisor

  - job_name: node-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["monitoring-node-exporter:9100"]
        labels:
          service: node-exporter

  - job_name: postgres
    metrics_path: /metrics
    scrape_interval: 60s
    scrape_timeout: 10s
    static_configs:
      - targets: ["monitoring-postgres-exporter:9187"]
        labels:
          service: postgres
          environment: production