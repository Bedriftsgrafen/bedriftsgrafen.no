# Dependabot Configuration for Automated Dependency Updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Frontend npm dependencies (workspace-aware)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Group React ecosystem updates
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Group TanStack Query updates
      tanstack:
        patterns:
          - "@tanstack/*"
      # Group Vite and build tools
      build-tools:
        patterns:
          - "vite"
          - "vite-*"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
      # Group TypeScript tooling
      typescript:
        patterns:
          - "typescript"
          - "@typescript-eslint/*"
      # Group testing utilities
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "jsdom"

  # Root npm dependencies (tooling like husky, lint-staged)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "tooling"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Group git hooks and linting tools
      tooling:
        patterns:
          - "husky"
          - "lint-staged"
          - "@lhci/*"

  # Backend Python dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Group FastAPI ecosystem
      fastapi:
        patterns:
          - "fastapi"
          - "fastapi-*"
          - "uvicorn"
          - "pydantic"
          - "pydantic-*"
      # Group SQLAlchemy and database
      database:
        patterns:
          - "sqlalchemy"
          - "alembic"
          - "psycopg2-binary"
          - "asyncpg"
      # Group Redis
      redis:
        patterns:
          - "redis"
          - "hiredis"
      # Group testing tools
      testing:
        patterns:
          - "pytest"
          - "pytest-*"
          - "httpx"
      # Group linting and type checking
      dev-tools:
        patterns:
          - "ruff"
          - "mypy"
          - "black"
          - "types-*"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
      - "backend"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "docker"
    directory: "/database"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
      - "database"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "ci"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Group all GitHub Actions updates
      github-actions:
        patterns:
          - "*"
