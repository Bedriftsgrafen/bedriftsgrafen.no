name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly security scan on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default permissions - most jobs only need read access
permissions:
  contents: read

jobs:
  # Frontend Security Audit
  frontend-security:
    name: Frontend Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (workspace)
        run: |
          npm audit --audit-level=moderate --json > npm-audit-report.json || true
          npm audit --audit-level=moderate

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          retention-days: 14

  # Backend Security Audit
  backend-security:
    name: Backend Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pip-audit bandit[toml]

      - name: pip-audit
        run: |
          pip-audit --format json --output pip-audit-report.json || true
          pip-audit

      - name: Bandit SAST
        run: |
          bandit -r . -ll -f json -o bandit-report.json || true
          bandit -r . -lll

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: backend/pip-audit-report.json
          retention-days: 14

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: backend/bandit-report.json
          retention-days: 14

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --gitleaks-ignore-path /repo/.gitleaksignore --no-banner --redact --verbose /repo

  # CodeQL Analysis
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript', 'python']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          config-file: .github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # Container Image Scanning with Trivy
  container-scanning:
    name: Container Image Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # For uploading SARIF results
    strategy:
      matrix:
        include:
          - dockerfile: backend/Dockerfile.prod
            context: .
            image: bedriftsgrafen-backend-prod
          - dockerfile: backend/Dockerfile
            context: .
            image: bedriftsgrafen-backend-dev
          - dockerfile: frontend/Dockerfile
            context: .
            image: bedriftsgrafen-frontend
            target: production
          - dockerfile: database/Dockerfile
            context: .
            image: bedriftsgrafen-database
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: ${{ matrix.image }}:latest
          load: true
          target: ${{ matrix.target || '' }}
          pull: true
          no-cache: true

      - name: Run Trivy (table, visible in logs)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ matrix.image }}:latest
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
          trivyignores: '.trivyignore'

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ matrix.image }}:latest
          format: 'sarif'
          output: 'trivy-${{ matrix.image }}-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          limit-severities-for-sarif: true

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles(format('trivy-{0}-results.sarif', matrix.image)) != ''
        with:
          sarif_file: 'trivy-${{ matrix.image }}-results.sarif'
          category: 'trivy-${{ matrix.image }}'

      - name: Run Trivy JSON report
        if: always()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ matrix.image }}:latest
          format: 'json'
          output: 'trivy-${{ matrix.image }}-report.json'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
        continue-on-error: true

      - name: Upload Trivy JSON report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-${{ matrix.image }}-report
          path: 'trivy-${{ matrix.image }}-report.json'
          retention-days: 14

  # License Compliance Check
  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check frontend licenses
        run: |
          cd frontend
          npx license-checker --json --out licenses-frontend.json
          npx license-checker --failOn "GPL;AGPL;LGPL" --excludePrivatePackages || echo "⚠️ License compliance check found issues"
        continue-on-error: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pip-licenses

      - name: Check backend licenses
        run: |
          pip-licenses --format=json --output-file=licenses-backend.json || true
          pip-licenses --format=markdown || true
        continue-on-error: true

      - name: Upload license reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: license-reports
          path: |
            frontend/licenses-frontend.json
            licenses-backend.json
          retention-days: 14

  # Security Summary
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [frontend-security, backend-security, secret-scanning, codeql-analysis, container-scanning, license-check]
    if: always()
    steps:
      - name: Generate Security Summary
        run: |
          echo "## 🛡️ Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Job Status" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Security | ${{ needs.frontend-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Security | ${{ needs.backend-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scanning | ${{ needs.secret-scanning.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL Analysis | ${{ needs.codeql-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Scanning | ${{ needs.container-scanning.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| License Check | ${{ needs.license-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 📊 Detailed Reports" >> $GITHUB_STEP_SUMMARY
          echo "- Check the **Actions Artifacts** section for detailed reports" >> $GITHUB_STEP_SUMMARY
          echo "- Review the **Security** tab for CodeQL and Trivy findings" >> $GITHUB_STEP_SUMMARY
          echo "- Monitor Dependabot alerts for dependency vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 🔍 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Review any failed jobs above" >> $GITHUB_STEP_SUMMARY
          echo "2. Check artifact reports for detailed vulnerability information" >> $GITHUB_STEP_SUMMARY
          echo "3. Address CRITICAL and HIGH severity issues promptly" >> $GITHUB_STEP_SUMMARY
          echo "4. Update dependencies with known vulnerabilities" >> $GITHUB_STEP_SUMMARY
