name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly security scan on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default permissions - most jobs only need read access
permissions:
  contents: read

jobs:
  # Secret Scanning with GitGuardian
  secret-scanning:
    name: Secret Scanning (GitGuardian)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true  # Don't block builds on secret detection
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive scanning

      - name: GitGuardian scan
        uses: GitGuardian/ggshield-action@v1.33.0
        continue-on-error: true
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  # Frontend Security Audit
  frontend-security:
    name: Frontend Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: |
          cd frontend
          npm audit --audit-level=moderate || true
          npm audit --json > npm-audit-report.json || true
        continue-on-error: true

      - name: Setup Java for OWASP Dependency-Check
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'bedriftsgrafen-frontend'
          path: './frontend'
          format: 'HTML,JSON'
          args: >
            --enableRetired
            --failOnCVSS 7
            --suppression ./frontend/dependency-check-suppressions.xml
        continue-on-error: true

      - name: Upload OWASP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-frontend
          path: reports/
          retention-days: 14

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: frontend/npm-audit-report.json
          retention-days: 14

  # Backend Security Audit
  backend-security:
    name: Backend Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14-dev'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install safety pip-audit bandit[toml]

      - name: Safety check
        run: |
          safety check --json --output safety-report.json || true
          safety check || true
        continue-on-error: true

      - name: pip-audit
        run: |
          pip-audit --format json --output pip-audit-report.json || true
          pip-audit || true
        continue-on-error: true

      - name: Bandit SAST
        run: |
          bandit -r . -f json -o bandit-report.json || true
          bandit -r . -ll || true
        continue-on-error: true

      - name: Upload safety report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-report
          path: backend/safety-report.json
          retention-days: 14

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: backend/pip-audit-report.json
          retention-days: 14

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: backend/bandit-report.json
          retention-days: 14

  # CodeQL Analysis
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript', 'python']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # Container Image Scanning with Trivy
  container-scanning:
    name: Container Image Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # For uploading SARIF results
    strategy:
      matrix:
        include:
          - dockerfile: backend/Dockerfile.prod
            context: backend
            image: bedriftsgrafen-backend-prod
          - dockerfile: backend/Dockerfile
            context: backend
            image: bedriftsgrafen-backend-dev
          - dockerfile: frontend/Dockerfile
            context: frontend
            image: bedriftsgrafen-frontend
            target: production
          - dockerfile: database/Dockerfile
            context: database
            image: bedriftsgrafen-database
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: ${{ matrix.image }}:latest
          load: true
          target: ${{ matrix.target || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.image }}:latest
          format: 'sarif'
          output: 'trivy-${{ matrix.image }}-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.image }}-results.sarif'
          category: 'trivy-${{ matrix.image }}'
        continue-on-error: true

      - name: Run Trivy JSON report
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.image }}:latest
          format: 'json'
          output: 'trivy-${{ matrix.image }}-report.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

      - name: Upload Trivy JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.image }}-report
          path: 'trivy-${{ matrix.image }}-report.json'
          retention-days: 14

  # License Compliance Check
  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check frontend licenses
        run: |
          cd frontend
          npx license-checker --json --out licenses-frontend.json
          npx license-checker --failOn "GPL;AGPL;LGPL" --excludePrivatePackages || echo "⚠️ License compliance check found issues"
        continue-on-error: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14-dev'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pip-licenses

      - name: Check backend licenses
        run: |
          pip-licenses --format=json --output-file=licenses-backend.json || true
          pip-licenses --format=markdown || true
        continue-on-error: true

      - name: Upload license reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-reports
          path: |
            frontend/licenses-frontend.json
            licenses-backend.json
          retention-days: 14

  # Security Summary
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [secret-scanning, frontend-security, backend-security, codeql-analysis, container-scanning, license-check]
    if: always()
    steps:
      - name: Generate Security Summary
        run: |
          echo "## 🛡️ Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Job Status" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scanning | ${{ needs.secret-scanning.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Security | ${{ needs.frontend-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Security | ${{ needs.backend-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL Analysis | ${{ needs.codeql-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Scanning | ${{ needs.container-scanning.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| License Check | ${{ needs.license-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 📊 Detailed Reports" >> $GITHUB_STEP_SUMMARY
          echo "- Check the **Actions Artifacts** section for detailed reports" >> $GITHUB_STEP_SUMMARY
          echo "- Review the **Security** tab for CodeQL and Trivy findings" >> $GITHUB_STEP_SUMMARY
          echo "- Monitor Dependabot alerts for dependency vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 🔍 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Review any failed jobs above" >> $GITHUB_STEP_SUMMARY
          echo "2. Check artifact reports for detailed vulnerability information" >> $GITHUB_STEP_SUMMARY
          echo "3. Address CRITICAL and HIGH severity issues promptly" >> $GITHUB_STEP_SUMMARY
          echo "4. Update dependencies with known vulnerabilities" >> $GITHUB_STEP_SUMMARY
