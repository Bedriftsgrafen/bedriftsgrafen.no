# =============================================================================
# DEV STACK - Bridge Mode (Standard Docker)
# =============================================================================
#
# Denne filen definerer dev-containere som:
# - Bruker prod's database (ingen egen db)
# - Kobler til prod's nettverk (internal-net)
# - Fungerer uavhengig av om porter er eksponert på host
#
# KRAV: Prod må kjøre først (for nettverk og database)
#
# Start:  docker compose -f docker-compose.dev.yml up -d
# Stopp:  docker compose -f docker-compose.dev.yml down
# Logs:   docker compose -f docker-compose.dev.yml logs -f
#
# =============================================================================

name: bedriftsgrafenno-dev

services:
  backend-dev:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bedriftsgrafen-backend-dev
    restart: unless-stopped
    init: true
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./scripts:/app/ops_scripts
    ports:
      - "8001:8001"
    networks:
      - bedriftsgrafen_internal-net
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_URL=postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@db:5432/${DATABASE_NAME}
      - DATABASE_URL_ASYNC=postgresql+asyncpg://${DATABASE_USER}:${DATABASE_PASSWORD}@db:5432/${DATABASE_NAME}
      - REDIS_HOST=redis
      - API_PORT=8001
      # Dev shares prod DB, so scheduled writes must stay owned by bedriftsgrafen-worker.
      - START_SCHEDULER=false
      - ENABLE_COMPANY_EVENT_LEDGER=true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          memory: 512M
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  frontend-dev:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    container_name: bedriftsgrafen-frontend-dev
    restart: unless-stopped
    init: true
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - /app/node_modules
      - /app/frontend/node_modules
    environment:
      - VITE_API_TARGET=http://backend-dev:8001
    networks:
      - bedriftsgrafen_internal-net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          memory: 256M
    depends_on:
      - backend-dev

networks:
  bedriftsgrafen_internal-net:
    external: true